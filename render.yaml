# ==============================================================================
# RENDER BLUEPRINT DEPLOYMENT SPECIFICATION — KHATA API
# Cost Safety Note: Explicitly configured with plan 'free' to ensure zero charges.
# Free instance cold-start: instance spins down after inactivity, resumes on request.
# ==============================================================================

services:
  - type: web
    name: khata-api
    env: node
    plan: free
    region: singapore
    buildCommand: npm ci --workspace=backend --include-workspace-root=false --include=dev && npm run build --workspace=backend
    startCommand: npm run start --workspace=backend
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: OWNER_PHONE
        sync: false
      - key: OWNER_PASSWORD_HASH
        sync: false
      - key: DATABASE_URL_POOLED
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_MAX_AGE_MS
        value: "2592000000"
      - key: SESSION_COOKIE_NAME
        value: khata_session
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_HTTP_ONLY
        value: "true"
      - key: SESSION_COOKIE_SAME_SITE
        value: lax
      - key: FRONTEND_URL
        value: https://erp.algions.in
      - key: BUSINESS_TIME_ZONE
        value: Asia/Kolkata
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_FAILURE_WINDOW_MS
        value: "900000"
      - key: LOGIN_LOCK_DURATION_MS
        value: "900000"
      - key: LOGIN_EXTENDED_THRESHOLD
        value: "10"
      - key: LOGIN_EXTENDED_WINDOW_MS
        value: "86400000"
      - key: LOGIN_EXTENDED_LOCK_DURATION_MS
        value: "1800000"
      - key: LOGIN_LOG_RETENTION_DAYS
        value: "30"
      - key: TRUST_PROXY
        value: "1"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: MONGODB_ENABLED
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: khata
      - key: MONGODB_READ_STALE_THRESHOLD_MS
        value: "300000"
      - key: READ_MODEL_DASHBOARD_REFRESH_MIN_INTERVAL_MS
        value: "15000"
