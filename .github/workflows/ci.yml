name: Khata CI Matrix

on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
    branches: [main]

jobs:
  # Job 1: Cross-platform matrix (Linux + Windows)
  matrix-build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Root Clean Install from Lockfile
        run: npm ci

      - name: Validate Digital Asset Links Configuration
        run: node frontend/scripts/validate-assetlinks.js

      - name: Full Monorepo Build
        run: npm run build

      - name: Unit Test Suite (Backend & Frontend)
        run: npm test

  # Job 2: Linux frontend-only Vercel-equivalent build
  vercel-frontend-build:
    name: Vercel Frontend Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Frontend Workspace Clean Install
        run: npm ci --workspace=frontend --include-workspace-root=false

      - name: Frontend Build
        run: npm run build --workspace=frontend

      - name: Verify Distribution Assets Exist
        run: test -f frontend/dist/index.html

  # Job 3: Linux backend workspace build (Render-equivalent)
  render-backend-build:
    name: Render Backend Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Backend Workspace Clean Install
        run: npm ci --workspace=backend --include-workspace-root=false

      - name: Backend Build
        run: npm run build --workspace=backend

  # Job 4: Real PostgreSQL + MongoDB Integration Suite
  postgres-integration:
    name: PostgreSQL & MongoDB Integration Tests (Real DBs)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: khata_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d khata_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:8
        env:
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)'"
          --health-start-period 15s
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install Dependencies
        run: npm ci

      - name: Build Monorepo
        run: npm run build

      - name: Run Real PostgreSQL & MongoDB Integration Tests
        env:
          REQUIRE_TEST_DATABASE_URL: 'true'
          TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/khata_test
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/khata_test
          DATABASE_URL_POOLED: postgresql://postgres:postgrespassword@localhost:5432/khata_test
          MONGODB_ENABLED: 'true'
          MONGODB_URI: mongodb://localhost:27017/khata_test
          MONGODB_DATABASE: khata_test
        run: npm run test:integration

  # Job 5: Android TWA Debug Build & Identity Verification
  android-twa-build:
    name: Android TWA Debug Build & Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Android SDK is pre-installed at /usr/local/lib/android/sdk on ubuntu-latest runners

      - name: Validate Gradle Wrapper Permissions
        run: |
          chmod +x android-twa/gradlew
          test -x android-twa/gradlew

      - name: Build Android Debug APK
        working-directory: android-twa
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify Debug APK Output Exists
        run: test -f android-twa/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify Release Build Fails Closed Without Signing Config
        shell: bash
        working-directory: android-twa
        run: |
          set -euo pipefail

          if [[ -f signing.properties ]]; then
            echo "ERROR: signing.properties exists; unsigned-release assertion cannot run safely."
            exit 1
          fi

          if [[ -n "${RELEASE_STORE_FILE:-}" ||
                -n "${RELEASE_STORE_PASSWORD:-}" ||
                -n "${RELEASE_KEY_ALIAS:-}" ||
                -n "${RELEASE_KEY_PASSWORD:-}" ]]; then
            echo "ERROR: Release signing credentials are present in this CI job."
            exit 1
          fi

          rm -f release-build.log
          set +e
          ./gradlew assembleRelease --no-daemon > release-build.log 2>&1
          BUILD_EXIT_CODE=$?
          set -e

          cat release-build.log

          if [[ "$BUILD_EXIT_CODE" -eq 0 ]]; then
            echo "SECURITY ERROR: unsigned assembleRelease unexpectedly succeeded."
            rm -f release-build.log
            exit 1
          fi

          if ! grep -Fq \
            "[SECURITY ERROR] Release build requested, but release signing credentials are missing!" \
            release-build.log; then
            echo "SECURITY ERROR: Release build failed for an unexpected reason."
            rm -f release-build.log
            exit 1
          fi

          rm -f release-build.log
          echo "PASS: Release build correctly failed only because signing credentials are missing."

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: khata-twa-debug-apk
          path: android-twa/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
