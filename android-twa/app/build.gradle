plugins {
    id 'com.android.application'
}

def signingPropertiesFile = rootProject.file('signing.properties')
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingProperties.load(new FileInputStream(signingPropertiesFile))
}

def hasReleaseSigningConfig = signingProperties.containsKey('RELEASE_STORE_FILE') || System.getenv('RELEASE_STORE_FILE') != null

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

android {
    namespace 'in.algions.khata'
    compileSdk 35

    defaultConfig {
        applicationId 'in.algions.khata'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        // Trusted Web Activity remote web URL configuration
        manifestPlaceholders = [
            hostName: "erp.algions.in",
            defaultUrl: "https://erp.algions.in",
            assetStatements: '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"web","site":"https://erp.algions.in"}}]'
        ]
    }

    signingConfigs {
        release {
            if (signingProperties.containsKey('RELEASE_STORE_FILE')) {
                def storeF = file(signingProperties['RELEASE_STORE_FILE'])
                storeFile storeF
                storePassword signingProperties['RELEASE_STORE_PASSWORD']
                keyAlias signingProperties['RELEASE_KEY_ALIAS']
                keyPassword signingProperties['RELEASE_KEY_PASSWORD']
            } else if (System.getenv('RELEASE_STORE_FILE') != null) {
                def storeF = file(System.getenv('RELEASE_STORE_FILE'))
                storeFile storeF
                storePassword System.getenv('RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ""
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Fail-closed verification for release builds: Never allow an unsigned release build
gradle.taskGraph.whenReady { taskGraph ->
    def isReleaseTask = taskGraph.allTasks.any { task ->
        task.name.equalsIgnoreCase("assembleRelease") ||
        task.name.equalsIgnoreCase("bundleRelease") ||
        task.name.equalsIgnoreCase("packageRelease")
    }
    if (isReleaseTask && !hasReleaseSigningConfig) {
        throw new GradleException(
            "[SECURITY ERROR] Release build requested, but release signing credentials are missing!\n" +
            "A release APK/AAB cannot be produced unsigned.\n" +
            "Please configure 'signing.properties' in android-twa/ or supply environment variables:\n" +
            "  RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD"
        )
    }
    if (isReleaseTask && hasReleaseSigningConfig) {
        def storeFilePath = signingProperties['RELEASE_STORE_FILE'] ?: System.getenv('RELEASE_STORE_FILE')
        def storeF = file(storeFilePath)
        if (!storeF.exists()) {
            throw new GradleException("[SECURITY ERROR] Release keystore file not found at: " + storeF.absolutePath)
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
}
